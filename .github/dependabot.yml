version: 2
updates:
  # PHP base image (FROM php:8.5.x-fpm) and WP-CLI are updated by the
  # update-base-deps workflow (deterministic, no Dependabot rate limits).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
